name: Build and Push Docker Image

on:
  push:
    branches:
      - main # Push on commits to main
    # Optional: Add tag trigger if needed
    # tags:
    #   - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to check out the repository
      packages: write # Needed if pushing to GHCR, can be 'none' for Docker Hub only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        # Optional: Add condition if you only want to login/push on specific events
        # if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use secrets for the Docker Hub repository name
          images: ${{ secrets.DOCKERHUB_USERNAME }}/saas-gateway
          tags: |
            # tag 'latest' for default branch (main) pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # Optional: Add tag trigger if needed
            # type=ref,event=tag
            # Add git sha tag
            type=sha

      # --- Build and Push Phase ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
